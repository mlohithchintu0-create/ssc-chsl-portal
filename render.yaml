services:
  - type: web
    name: ssc-chsl-portal
    env: python
    buildCommand: "pip install -r requirements.txt && python seed_data.py"
    startCommand: "gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
