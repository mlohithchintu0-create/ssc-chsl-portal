{% extends "base.html" %}

{% block title %}Create Aspirant Account - SSC CHSL Preparation Portal{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-6 bg-white p-8 sm:p-10 rounded-3xl border border-slate-200 shadow-xl">
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-2xl bg-ssc-900 text-white mx-auto flex items-center justify-center text-xl shadow-md">
                <i class="fa-solid fa-user-plus text-amber-400"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-slate-900">Create Candidate Account</h2>
            <p class="text-xs text-slate-500">Track full mock attempts, identify weak topics, and prepare for SSC CHSL 2026.</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}" class="space-y-4 text-xs font-semibold text-slate-700">
            <div>
                <label class="block mb-1">Full Name</label>
                <input type="text" name="full_name" required placeholder="e.g. Rahul Sharma" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl font-medium text-slate-900 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="block mb-1">Username</label>
                <input type="text" name="username" required placeholder="e.g. rahul_chsl26" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl font-medium text-slate-900 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="block mb-1">Email Address</label>
                <input type="email" name="email" required placeholder="rahul@example.com" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl font-medium text-slate-900 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="block mb-1">Password</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl font-medium text-slate-900 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <button type="submit" class="w-full py-3 bg-ssc-900 hover:bg-blue-800 text-white rounded-xl text-xs font-extrabold shadow-md transition-colors">
                Create Account & Begin Preparation
            </button>
        </form>

        <div class="text-center text-xs text-slate-500 pt-2 border-t border-slate-100">
            Already registered? 
            <a href="{{ url_for('login') }}" class="text-blue-600 font-bold hover:underline">Log in</a>
        </div>
    </div>
</div>
{% endblock %}
